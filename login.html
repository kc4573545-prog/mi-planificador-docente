<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_tab" name="shell-type"/><title>Acceso · Mi Planificador Docente</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script src="js/tailwind-config.js"></script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><main class="flex min-h-screen items-center justify-center p-4"><div class="w-full max-w-sm space-y-4">
<div class="text-center"><div class="text-label-md text-secondary">MINERD</div><h1 class="text-headline-md text-primary">Mi Planificador Docente</h1>
<p class="text-body-md text-on-surface-variant">Planes de clase alineados al currículo dominicano</p></div>
<form id="f" class="rounded-xl border border-outline-variant bg-surface-container-lowest p-4 shadow-sm space-y-3"><h2 id="titulo" class="text-title-md"></h2>
<div id="campo-nombre" class="hidden"><div><label class="block mb-1 text-label-md text-on-surface-variant">Nombre completo</label><input id="nombre" autocomplete="name" class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2 text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-fixed-dim"></div></div>
<div><label class="block mb-1 text-label-md text-on-surface-variant">Correo electrónico</label><input id="email" type="email" required autocomplete="email" class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2 text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-fixed-dim"></div>
<div><label class="block mb-1 text-label-md text-on-surface-variant">Contraseña (mínimo 8 caracteres)</label><input id="password" type="password" required minlength="8" class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2 text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-fixed-dim"></div>
<p id="error" class="text-body-sm text-error" role="alert"></p>
<button id="enviar" class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary-container px-4 py-3 text-title-sm text-on-primary active:scale-95 transition disabled:opacity-60 w-full"></button>
<button type="button" id="cambiar" class="w-full text-label-md text-primary"></button></form></div></main>
<script src="js/api.js"></script><script src="js/login.js"></script></body></html>
